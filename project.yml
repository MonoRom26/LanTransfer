name: LanTransfer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
targets:
  LanTransfer:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LAN Transfer
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Used to transfer files with your computer and other iPhones over Wi-Fi.
        NSBonjourServices: ["_lantransfer._tcp"]
        NSCameraUsageDescription: Used to scan the QR code shown on another iPhone.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lantransfer
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
