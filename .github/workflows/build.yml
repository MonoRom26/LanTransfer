name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, arm64)
        run: |
          xcodebuild -project LanTransfer.xcodeproj \
            -scheme LanTransfer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package for TrollStore (fake-signed, no developer certificate)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LanTransfer.app Payload/
          ldid -S Payload/LanTransfer.app/LanTransfer
          zip -r LanTransfer.ipa Payload
          cp LanTransfer.ipa LanTransfer.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: LanTransfer-trollstore
          path: |
            LanTransfer.tipa
            LanTransfer.ipa

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LanTransfer.tipa
            LanTransfer.ipa
