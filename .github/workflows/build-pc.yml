name: Build PC app

on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/build-pc.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install -r requirements-build.txt

      - name: Run tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Build the exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LanTransferPC --collect-all tkinterdnd2 run_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: LanTransferPC-windows
          path: pc/dist/LanTransferPC.exe
